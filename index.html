<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>太鼓之达人 段位道场理论成绩</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
      color: #333;
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 0;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .lang-switch {
      display: flex;
      gap: 4px;
    }
    .lang-btn {
      padding: 4px 10px;
      font-size: 0.85rem;
      font-family: inherit;
      color: #666;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .lang-btn:hover {
      border-color: #1565c0;
      color: #1565c0;
    }
    .lang-btn.active {
      background: #1565c0;
      color: #fff;
      border-color: #1565c0;
      font-weight: 600;
    }
    #loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    .matrix-wrapper {
      overflow: auto;
      max-height: 80vh;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: relative;
    }
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .tab-btn {
      padding: 8px 20px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #666;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn:hover {
      background: #f5f5f5;
    }
    .tab-btn.active {
      color: #1565c0;
      border-color: #1565c0;
      background: #e3f2fd;
      font-weight: 600;
    }
    .main-tab-bar {
      margin-bottom: 16px;
    }
    .main-tab-bar .tab-btn {
      font-size: 1.05rem;
      padding: 10px 28px;
    }
    .sub-tab-bar {
      margin-bottom: 12px;
    }
    .sub-tab-bar .tab-btn {
      font-size: 0.9rem;
      padding: 6px 16px;
    }
    .panel {
      display: none;
    }
    .panel.active {
      display: block;
    }
    .import-card {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 32px;
      display: flex;
      gap: 32px;
    }
    .import-section {
      flex: 1;
      margin-bottom: 0;
    }
    .import-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }
    .import-desc {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 16px;
    }
    .input-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .input-group input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .sync-btn {
      padding: 10px 24px;
      background: #1565c0;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    .sync-btn:hover {
      background: #0d47a1;
    }
    .sync-btn:disabled {
      background: #90caf9;
      cursor: not-allowed;
    }
    .input-group input[type="file"] {
      font-size: 0.9rem;
      font-family: inherit;
    }
    .status-text {
      margin-top: 12px;
      font-size: 0.9rem;
      min-height: 1.2em;
    }
    .status-text.success { color: #2e7d32; }
    .status-text.error { color: #c62828; }
    .status-text.info { color: #1565c0; }
    .divider {
      width: 1px;
      background: #e0e0e0;
      margin: 0;
      flex-shrink: 0;
    }
    .placeholder {
      padding: 60px 20px;
      text-align: center;
      color: #888;
      font-size: 1rem;
    }
    table {
      border-collapse: collapse;
      min-width: 100%;
      table-layout: fixed;
    }
    th, td {
      border: 1px solid #e0e0e0;
      text-align: center;
      vertical-align: middle;
    }
    th {
      background: #fafafa;
      font-weight: 600;
      padding: 8px 4px;
      font-size: 0.85rem;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    td {
      padding: 4px;
      height: 56px;
      width: 56px;
      min-width: 56px;
    }
    .version-cell {
      background: #fafafa;
      font-weight: 600;
      font-size: 0.85rem;
      width: 100px;
      min-width: 100px;
      position: sticky;
      left: 0;
      z-index: 2;
    }
    .version-header {
      position: sticky;
      left: 0;
      top: 0;
      z-index: 11;
      background: #f0f0f0;
    }
    .dani-cell {
      cursor: pointer;
      transition: background 0.15s;
    }
    .dani-cell:hover {
      background: #f0f8ff;
    }
    .dani-cell img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
    .dani-cell.missing {
      background: #f5f5f5;
    }
    .dani-cell.selected {
      outline: 2px solid #2196f3;
      outline-offset: -2px;
    }
    .detail-row td {
      padding: 0;
      height: auto;
      text-align: left;
    }
    .detail-panel {
      padding: 16px;
      background: #fafafa;
      border-top: 2px solid #2196f3;
    }
    .detail-header {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #222;
    }
    .detail-section {
      margin-bottom: 16px;
    }
    .detail-section-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: #555;
      border-bottom: 1px solid #ddd;
      padding-bottom: 4px;
    }
    .song-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    .song-table td {
      padding: 6px 10px 6px 0;
      vertical-align: baseline;
      border: none;
      white-space: nowrap;
    }
    .song-table td:last-child {
      padding-right: 0;
    }
    .song-name-cell {
      max-width: 480px;
      min-width: 200px;
      white-space: normal;
    }
    .song-diff {
      color: #666;
      font-size: 0.85rem;
    }
    .song-id {
      color: #888;
      font-size: 0.8rem;
      margin-left: 4px;
    }
    .stat-label {
      display: inline-block;
      width: 2.5em;
      text-align: right;
      color: #666;
      font-size: 0.9rem;
    }
    .stat-val {
      display: inline-block;
      width: 3em;
      text-align: left;
      font-size: 0.9rem;
    }
    .stat-val.combo {
      width: 5em;
    }
    .stat-highlight {
      font-weight: bold;
    }
    .song-missing {
      color: #999;
      font-size: 0.8rem;
      margin-left: 8px;
    }
    .cond-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .cond-item {
      margin-bottom: 12px;
      padding: 10px;
      background: #fff;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
    }
    .cond-type {
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }
    .cond-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.9rem;
      margin: 4px 0;
    }
    .cond-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .badge-red { background: #ffebee; color: #c62828; }
    .badge-gold { background: #fff8e1; color: #f9a825; }
    .badge-score { background: #e3f2fd; color: #1565c0; }
    .badge-missing { background: #f5f5f5; color: #999; }
    .per-song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin-top: 6px;
    }
    .per-song-item {
      background: #fafafa;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #eee;
    }
    .per-song-title {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #666;
    }
    .edit-btn {
      font-size: 0.8rem;
      color: #666;
      background: none;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      margin-left: 4px;
    }
    .edit-btn:hover {
      color: #1565c0;
      border-color: #1565c0;
    }
    .manual-badge {
      font-size: 0.75rem;
      color: #1565c0;
      margin-left: 4px;
    }
    .edit-form-row td {
      padding: 8px 16px;
      background: #f0f8ff;
      border-top: 1px solid #e3f2fd;
      height: auto;
    }
    .edit-form {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .edit-form label {
      font-size: 0.85rem;
      color: #555;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .edit-form input {
      width: 60px;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.85rem;
      font-family: inherit;
    }
    .reset-manual-btn {
      margin-top: 16px;
      padding: 8px 20px;
      background: #c62828;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    .reset-manual-btn:hover {
      background: #b71c1c;
    }
    .reset-manual-desc {
      font-size: 0.85rem;
      color: #666;
      margin-top: 6px;
    }
    @media (max-width: 768px) {
      h1 { font-size: 1.1rem; }
      .version-cell { width: 80px; min-width: 80px; font-size: 0.75rem; }
      td { width: 44px; min-width: 44px; height: 44px; }
      .dani-cell img { width: 32px; height: 32px; }
      .import-card { flex-direction: column; gap: 24px; padding: 20px; }
      .divider { width: 100%; height: 1px; }
      .edit-form { gap: 8px; }
      .edit-form input { width: 50px; }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>太鼓之达人 段位道场理论成绩</h1>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="zh" onclick="switchLang('zh')">中</button>
      <button class="lang-btn" data-lang="ja" onclick="switchLang('ja')">日</button>
    </div>
  </div>
  <div id="loading">加载数据中...</div>
  <div id="app" style="display:none;">
    <div class="tab-bar main-tab-bar">
      <button class="tab-btn active" data-main-tab="import" onclick="switchMainTab('import')">导入数据</button>
      <button class="tab-btn" data-main-tab="display" onclick="switchMainTab('display')">成绩展示</button>
    </div>

    <div id="import-panel" class="panel active">
      <div class="import-card">
        <div class="import-section">
          <div class="import-title">从 donder 查分器同步</div>
          <div class="import-desc">输入你的 donder 用户 ID，点击同步按钮获取最新成绩</div>
          <div class="input-group">
            <input type="text" id="donder-id-input" placeholder="请输入 donder ID" />
            <button class="sync-btn" onclick="syncFromApi()">同步成绩</button>
          </div>
          <div id="api-status" class="status-text"></div>
        </div>
        <div class="divider"></div>
        <div class="import-section">
          <div class="import-title">上传本地 JSON</div>
          <div class="import-desc">上传符合格式的成绩 JSON 文件</div>
          <div class="input-group">
            <input type="file" id="json-file-input" accept=".json" onchange="handleFileSelect(this)" />
          </div>
          <div id="upload-status" class="status-text"></div>
          <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #e0e0e0;">
            <div class="import-title">手动成绩管理</div>
            <div class="import-desc">清空在详情面板中手动输入的假设成绩</div>
            <button class="reset-manual-btn" onclick="resetManualScores()">重置手动修改</button>
            <div class="reset-manual-desc">恢复为真实成绩数据，不影响 API 同步或 JSON 上传的成绩</div>
          </div>
        </div>
      </div>
    </div>

    <div id="display-panel" class="panel">
      <div class="tab-bar sub-tab-bar">
        <button class="tab-btn active" data-sub-tab="main" onclick="switchSubTab('main')">本篇</button>
        <button class="tab-btn" data-sub-tab="extra" onclick="switchSubTab('extra')">外传</button>
      </div>
      <div class="matrix-wrapper">
        <table id="matrix"></table>
      </div>
    </div>
  </div>

  <script>
    const TYPE_LABELS = {
      gauge: '魂槽',
      hits: '敲击数',
      good: '良',
      ok: '可',
      bad: '不可',
      roll: '连打数',
      combo: '连击数',
      rolls: '连打数',
      score: '得分'
    };

    const ICON_MAP = {
      gold: {
        normal: 'dani_score_logo/GoldNormalClear.webp',
        fc: 'dani_score_logo/GoldFullComboClear.webp',
        perfect: 'dani_score_logo/GoldPerfectClear.webp'
      },
      red: {
        normal: 'dani_score_logo/RedNormalClear.webp',
        fc: 'dani_score_logo/RedFullComboClear.webp',
        perfect: 'dani_score_logo/RedPerfectClear.webp'
      },
      notclear: 'dani_score_logo/NotClear.webp'
    };

    const DANI_ORDER = [
      'shokyu', 'kyu_10', 'kyu_9', 'kyu_8', 'kyu_7', 'kyu_6',
      'kyu_5', 'kyu_4', 'kyu_3', 'kyu_2', 'kyu_1',
      'dan_1', 'dan_2', 'dan_3', 'dan_4', 'dan_5',
      'dan_6', 'dan_7', 'dan_8', 'dan_9', 'dan_10',
      'kuroto', 'meijin', 'choujin', 'tatsujin'
    ];

    const DANI_NAME_MAP = {
      shokyu: '初級', kyu_10: '十級', kyu_9: '九級', kyu_8: '八級', kyu_7: '七級',
      kyu_6: '六級', kyu_5: '五級', kyu_4: '四級', kyu_3: '三級', kyu_2: '二級',
      kyu_1: '一級', dan_1: '初段', dan_2: '二段', dan_3: '三段', dan_4: '四段',
      dan_5: '五段', dan_6: '六段', dan_7: '七段', dan_8: '八段', dan_9: '九段',
      dan_10: '十段', kuroto: '玄人', meijin: '名人', choujin: '超人', tatsujin: '達人'
    };

    let daniData = null;
    let extraDanniData = null;
    let scoreData = null;
    let scoreMap = new Map();
    let highScoreMap = new Map();
    let manualScoreMap = new Map();
    let manualHighScoreMap = new Map();
    let allDaniIds = [];
    let selectedCellKey = null;
    let currentMainTab = 'import';
    let currentSubTab = 'main';
    let currentLang = 'zh';

    function loadLang() {
      const saved = localStorage.getItem('5y3d_lang');
      if (saved === 'zh' || saved === 'ja') {
        currentLang = saved;
      }
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang);
      });
    }

    function getSongName(song) {
      if (currentLang === 'zh' && song.name_zh && song.name_zh.trim() !== '') {
        return song.name_zh;
      }
      return song.name;
    }

    function switchLang(lang) {
      if (lang === currentLang) return;
      currentLang = lang;
      localStorage.setItem('5y3d_lang', lang);
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      const savedKey = selectedCellKey;
      selectedCellKey = null;
      renderMatrix();
      if (savedKey) {
        const cell = document.querySelector(`.dani-cell[data-key="${savedKey}"]`);
        if (cell) cell.click();
      }
    }

    async function loadData() {
      try {
        const daniRes = await fetch('dani_datas/dani_data.json');
        if (!daniRes.ok) throw new Error('dani_data.json HTTP ' + daniRes.status);
        daniData = await daniRes.json();
      } catch (e) {
        console.error('Failed to load dani_data.json:', e);
        throw new Error('段位数据加载失败，请确认 dani_datas/dani_data.json 文件存在');
      }

      try {
        const extraRes = await fetch('dani_datas/gaiden_data.json');
        if (!extraRes.ok) throw new Error('gaiden_data.json HTTP ' + extraRes.status);
        extraDanniData = await extraRes.json();
      } catch (e) {
        console.error('Failed to load gaiden_data.json:', e);
        throw new Error('外传数据加载失败，请确认 dani_datas/gaiden_data.json 文件存在');
      }

      const cachedScore = localStorage.getItem('5y3d_score_data');
      if (cachedScore) {
        try {
          scoreData = JSON.parse(cachedScore);
          buildScoreMaps();
          console.log('Score data loaded from localStorage');
        } catch (e) {
          console.error('Failed to parse cached score data', e);
          await loadDefaultScore();
        }
      } else {
        await loadDefaultScore();
      }

      const cachedId = localStorage.getItem('5y3d_donder_id');
      if (cachedId) {
        const input = document.getElementById('donder-id-input');
        if (input) input.value = cachedId;
      }

      allDaniIds = DANI_ORDER.slice();
      loadLang();

      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('import-panel').classList.add('active');
      renderMatrix();
    }

    async function loadDefaultScore() {
      try {
        const scoreRes = await fetch('score_example.json');
        if (!scoreRes.ok) throw new Error('score_example.json HTTP ' + scoreRes.status);
        scoreData = await scoreRes.json();
        buildScoreMaps();
        console.log('Default score data loaded from score_example.json');
      } catch (e) {
        console.error('Failed to load score_example.json:', e);
        scoreData = [];
        buildScoreMaps();
      }
    }

    function buildScoreMaps() {
      scoreMap = new Map();
      highScoreMap = new Map();
      for (const item of scoreData) {
        const key = `${item.song_no}_${item.level}`;
        scoreMap.set(key, item.high_score_result);
        highScoreMap.set(key, item.high_score);
      }
      manualScoreMap = new Map();
      manualHighScoreMap = new Map();
      try {
        const raw = localStorage.getItem('5y3d_manual_scores');
        if (raw) {
          const obj = JSON.parse(raw);
          for (const [key, val] of Object.entries(obj)) {
            if (val && Array.isArray(val.high_score_result)) {
              manualScoreMap.set(key, val.high_score_result);
            }
            if (val && typeof val.high_score === 'number') {
              manualHighScoreMap.set(key, val.high_score);
            }
          }
        }
      } catch (e) {
        console.error('Failed to load manual scores', e);
      }
    }

    function getScore(songId, difficulty) {
      if (songId == null || songId === -1) return null;
      const key = `${songId}_${difficulty}`;
      if (manualScoreMap.has(key)) return manualScoreMap.get(key);
      return scoreMap.get(key) || null;
    }

    function getHighScore(songId, difficulty) {
      if (songId == null || songId === -1) return null;
      const key = `${songId}_${difficulty}`;
      if (manualHighScoreMap.has(key)) return manualHighScoreMap.get(key);
      return highScoreMap.get(key) || null;
    }

    function evaluate(value, operator, target) {
      if (operator === '>=') return value >= target;
      if (operator === '<') return value < target;
      if (operator === '=') return value === target;
      return false;
    }

    function computeDaniResult(dani) {
      const songResults = dani.songs.map(s => ({
        song: s,
        score: getScore(s.song_id, s.difficulty),
        highScore: getHighScore(s.song_id, s.difficulty)
      }));

      const hasMissing = songResults.some(r => r.score == null);

      let frame = 'normal';
      if (!hasMissing) {
        const allPerfect = songResults.every(r => r.score[0] >= r.song.notes);
        if (allPerfect) {
          frame = 'perfect';
        } else {
          const allFC = songResults.every(r => r.score[4] >= r.song.notes);
          if (allFC) frame = 'fc';
        }
      }

      if (hasMissing) {
        return { clear: 'not', frame: 'normal', hasMissing: true, songResults, values: {} };
      }

      function sum(idx) {
        return songResults.reduce((a, b) => a + b.score[idx], 0);
      }
      const goodTotal = sum(0);
      const okTotal = sum(1);
      const badTotal = sum(2);
      const rollTotal = sum(3);
      const comboTotal = sum(4);
      const hitsTotal = goodTotal + okTotal + rollTotal;

      const values = {
        gauge: null,
        hits: hitsTotal,
        good: goodTotal,
        ok: okTotal,
        bad: badTotal,
        roll: rollTotal,
        rolls: rollTotal,
        combo: comboTotal,
        score: songResults.reduce((a, b) => a + (b.highScore || 0), 0)
      };

      const perSongValues = {};
      for (const type of ['gauge', 'hits', 'good', 'ok', 'bad', 'roll', 'rolls', 'combo', 'score']) {
        perSongValues[type] = songResults.map((r) => {
          if (type === 'gauge') return null;
          if (type === 'score') return r.highScore || 0;
          const g = r.score[0], o = r.score[1], b = r.score[2], ro = r.score[3], c = r.score[4];
          const mapping = {
            hits: g + o + ro,
            good: g,
            ok: o,
            bad: b,
            roll: ro,
            rolls: ro,
            combo: c
          };
          return mapping[type];
        });
      }

      let goldOk = true;
      let redOk = true;

      for (const cond of dani.clear_conditions) {
        if (cond.type === 'gauge') continue;
        const typeKey = cond.type;
        if (cond.scope === 'shared') {
          const playerVal = values[typeKey] ?? 0;
          if (cond.gold && !evaluate(playerVal, cond.gold.operator, cond.gold.value)) {
            goldOk = false;
          }
          if (cond.red && !evaluate(playerVal, cond.red.operator, cond.red.value)) {
            redOk = false;
          }
        } else if (cond.scope === 'per_song') {
          const arr = perSongValues[typeKey] || [0, 0, 0];
          for (let i = 0; i < 3; i++) {
            const playerVal = arr[i] ?? 0;
            const goldReq = cond.gold ? cond.gold[i] : null;
            const redReq = cond.red ? cond.red[i] : null;
            if (goldReq && !evaluate(playerVal, goldReq.operator, goldReq.value)) {
              goldOk = false;
            }
            if (redReq && !evaluate(playerVal, redReq.operator, redReq.value)) {
              redOk = false;
            }
          }
        }
      }

      let clear = 'not';
      if (goldOk) clear = 'gold';
      else if (redOk) clear = 'red';

      return { clear, frame, hasMissing, songResults, values, perSongValues };
    }

    function renderMatrix() {
      const table = document.getElementById('matrix');
      table.innerHTML = '';

      const oldDetail = document.querySelector('.detail-row');
      if (oldDetail) oldDetail.remove();
      selectedCellKey = null;
      document.querySelectorAll('.dani-cell.selected').forEach(el => el.classList.remove('selected'));

      const existingPlaceholder = table.parentNode.querySelector('.placeholder');
      if (existingPlaceholder) existingPlaceholder.remove();

      if (currentSubTab === 'extra') {
        table.style.display = '';
        if (!extraDanniData || !extraDanniData.versions || extraDanniData.versions.length === 0) {
          const placeholder = document.createElement('div');
          placeholder.className = 'placeholder';
          placeholder.textContent = '外传段位数据加载失败';
          table.parentNode.insertBefore(placeholder, table.nextSibling);
          if (table.style.display !== 'none') table.style.display = 'none';
          return;
        }

        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        const thName = document.createElement('th');
        thName.textContent = '段位';
        thName.className = 'version-header';
        headerRow.appendChild(thName);

        const thStatus = document.createElement('th');
        thStatus.textContent = '状态';
        headerRow.appendChild(thStatus);
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        for (const version of extraDanniData.versions) {
          for (const dani of version.danis) {
            const row = document.createElement('tr');
            row.id = `row-${version.id}-${dani.id}`;

            const nameCell = document.createElement('td');
            nameCell.className = 'version-cell';
            nameCell.textContent = dani.name;
            row.appendChild(nameCell);

            const result = computeDaniResult(dani);

            const statusCell = document.createElement('td');
            statusCell.className = 'dani-cell';
            const cellKey = `${version.id}_${dani.id}`;
            statusCell.dataset.key = cellKey;
            statusCell.dataset.versionId = version.id;
            statusCell.dataset.daniId = dani.id;

            if (result.hasMissing) {
              statusCell.classList.add('missing');
              statusCell.textContent = '未完全游玩';
            } else if (result.clear === 'not') {
              const img = document.createElement('img');
              img.src = ICON_MAP.notclear;
              img.alt = 'notclear';
              statusCell.appendChild(img);
            } else {
              const img = document.createElement('img');
              img.src = ICON_MAP[result.clear][result.frame];
              img.alt = `${result.clear}-${result.frame}`;
              statusCell.appendChild(img);
            }

            statusCell.addEventListener('click', () => toggleDetail(version, dani, result, statusCell));
            row.appendChild(statusCell);
            tbody.appendChild(row);
          }
        }
        table.appendChild(tbody);
        return;
      }

      table.style.display = '';

      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      const thVersion = document.createElement('th');
      thVersion.textContent = '版本';
      thVersion.className = 'version-header';
      headerRow.appendChild(thVersion);

      for (const daniId of allDaniIds) {
        const th = document.createElement('th');
        th.textContent = DANI_NAME_MAP[daniId] || daniId;
        headerRow.appendChild(th);
      }
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      for (const version of daniData.versions) {
        const daniMap = new Map(version.danis.map(d => [d.id, d]));
        const row = document.createElement('tr');
        row.id = `row-${version.id}`;

        const versionCell = document.createElement('td');
        versionCell.className = 'version-cell';
        versionCell.textContent = version.name_zh || version.name || version.id;
        row.appendChild(versionCell);

        for (const daniId of allDaniIds) {
          const cell = document.createElement('td');
          const dani = daniMap.get(daniId);
          if (!dani) {
            cell.style.background = '#fafafa';
            cell.title = '该版本无此段位';
            row.appendChild(cell);
            continue;
          }

          const result = computeDaniResult(dani);
          cell.className = 'dani-cell';
          const cellKey = `${version.id}_${daniId}`;
          cell.dataset.key = cellKey;
          cell.dataset.versionId = version.id;
          cell.dataset.daniId = daniId;

          if (result.hasMissing) {
            cell.classList.add('missing');
            cell.textContent = '未完全游玩';
          } else if (result.clear === 'not') {
            const img = document.createElement('img');
            img.src = ICON_MAP.notclear;
            img.alt = 'notclear';
            cell.appendChild(img);
          } else {
            const img = document.createElement('img');
            img.src = ICON_MAP[result.clear][result.frame];
            img.alt = `${result.clear}-${result.frame}`;
            cell.appendChild(img);
          }

          cell.addEventListener('click', () => toggleDetail(version, dani, result, cell));
          row.appendChild(cell);
        }
        tbody.appendChild(row);
      }
      table.appendChild(tbody);
    }

    function switchMainTab(tab) {
      if (tab === currentMainTab) return;
      currentMainTab = tab;
      document.querySelectorAll('.main-tab-bar .tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mainTab === tab);
      });
      document.getElementById('import-panel').classList.toggle('active', tab === 'import');
      document.getElementById('display-panel').classList.toggle('active', tab === 'display');
      if (tab === 'display') {
        renderMatrix();
      }
    }

    function switchSubTab(tab) {
      if (tab === currentSubTab) return;
      currentSubTab = tab;
      document.querySelectorAll('.sub-tab-bar .tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.subTab === tab);
      });
      renderMatrix();
    }

    async function syncFromApi() {
      const input = document.getElementById('donder-id-input');
      const statusEl = document.getElementById('api-status');
      const id = input.value.trim();

      if (!id) {
        statusEl.textContent = '请输入 donder ID';
        statusEl.className = 'status-text error';
        return;
      }

      const btn = document.querySelector('.sync-btn');
      btn.disabled = true;
      statusEl.textContent = '正在同步...';
      statusEl.className = 'status-text info';

      try {
        const url = `https://hasura.llx.life/api/rest/donder/get-score?id=${encodeURIComponent(id)}`;
        const res = await fetch(url);

        if (!res.ok) {
          throw new Error(`Server error: ${res.status}`);
        }

        const result = await res.json();

        if (!result || !result.score || typeof result.score.data !== 'string') {
          throw new Error('Invalid response format: expected { score: { data: "[...]" } }');
        }

        const rawList = JSON.parse(result.score.data);
        if (!Array.isArray(rawList)) {
          throw new Error('Parsed score data is not an array');
        }

        const data = rawList.map(item => ({
          song_no: item.song_no,
          level: item.level,
          high_score: item.high_score,
          high_score_result: [item.good_cnt, item.ok_cnt, item.ng_cnt, item.pound_cnt, item.combo_cnt],
          best_score_rank: item.best_score_rank,
          option_flg: item.option_flg,
          tone_flg: item.tone_flg,
          highscore_mode: item.highscore_mode,
          highscore_datetime: item.highscore_datetime,
          update_datetime: item.update_datetime
        }));

        scoreData = data;
        buildScoreMaps();
        localStorage.setItem('5y3d_donder_id', id);
        localStorage.setItem('5y3d_score_data', JSON.stringify(scoreData));

        statusEl.textContent = `Sync success! ${data.length} score records`;
        statusEl.className = 'status-text success';

        setTimeout(() => {
          switchMainTab('display');
          if (currentSubTab !== 'main') {
            switchSubTab('main');
          }
        }, 800);

      } catch (err) {
        console.error(err);
        let msg = err.message;
        if (msg.includes('Failed to fetch') || msg.includes('NetworkError') || msg.includes('CORS')) {
          msg = 'Request failed. This may be due to CORS restrictions. Please use JSON upload instead.';
        }
        statusEl.textContent = msg;
        statusEl.className = 'status-text error';
      } finally {
        btn.disabled = false;
      }
    }

    function handleFileSelect(input) {
      const statusEl = document.getElementById('upload-status');
      const file = input.files[0];

      if (!file) return;

      statusEl.textContent = 'Reading file...';
      statusEl.className = 'status-text info';

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);

          if (!Array.isArray(data)) {
            throw new Error('Root object must be an array');
          }

          if (data.length > 0 && (!data[0].hasOwnProperty('song_no') || !data[0].hasOwnProperty('high_score_result'))) {
            throw new Error('Data fields do not match expected format');
          }

          scoreData = data;
          buildScoreMaps();
          localStorage.setItem('5y3d_score_data', JSON.stringify(scoreData));

          statusEl.textContent = `Upload success! ${data.length} score records`;
          statusEl.className = 'status-text success';

          input.value = '';

          setTimeout(() => {
            switchMainTab('display');
            if (currentSubTab !== 'main') {
              switchSubTab('main');
            }
          }, 800);

        } catch (err) {
          console.error(err);
          statusEl.textContent = `Parse failed: ${err.message}`;
          statusEl.className = 'status-text error';
          input.value = '';
        }
      };
      reader.onerror = () => {
        statusEl.textContent = 'File read failed';
        statusEl.className = 'status-text error';
      };
      reader.readAsText(file);
    }

    function toggleDetail(version, dani, result, cell) {
      const cellKey = cell.dataset.key;
      document.querySelectorAll('.dani-cell.selected').forEach(el => el.classList.remove('selected'));
      const oldDetail = document.querySelector('.detail-row');
      if (oldDetail) oldDetail.remove();

      if (selectedCellKey === cellKey) {
        selectedCellKey = null;
        return;
      }

      selectedCellKey = cellKey;
      cell.classList.add('selected');

      const detailRow = document.createElement('tr');
      detailRow.className = 'detail-row';
      const detailCell = document.createElement('td');
      const colCount = document.querySelectorAll('#matrix thead th').length;
      detailCell.colSpan = colCount;
      detailCell.innerHTML = buildDetailHTML(version, dani, result);
      detailRow.appendChild(detailCell);

      const currentRow = cell.closest('tr');
      currentRow.after(detailRow);
      detailRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function formatValue(type, value) {
      if (value == null) return '-';
      if (type === 'gauge') return `${(value * 100).toFixed(0)}%`;
      return String(value);
    }

    function buildDetailHTML(version, dani, result) {
      const header = `<div class="detail-header">${version.name_zh || version.name || version.id} · ${dani.name}</div>`;

      let songsHtml = '<div class="detail-section"><div class="detail-section-title">课题曲</div><table class="song-table"><tbody>';
      for (const s of dani.songs) {
        const songRes = result.songResults.find(r => r.song.order === s.order);
        const hasScore = songRes && songRes.score != null;
        const diffStars = s.stars ? `★${s.stars}` : '';
        const diffLabel = ['', '简单', '普通', '困难', '魔王', '魔王(裏)'][s.difficulty] || '';
        const idTag = s.song_id > 0 ? `<span class="song-id">ID:${s.song_id}</span>` : '';
        const songKey = `${s.song_id}_${s.difficulty}`;
        const isManual = s.song_id > 0 && manualScoreMap.has(songKey);
        const manualBadge = isManual ? '<span class="manual-badge">🖊️</span>' : '';
        const editBtn = s.song_id > 0 ? `<button class="edit-btn" onclick="startEditSong('${songKey}', ${s.order}, this)">编辑</button>` : '';

        let statsHtml = '';
        if (hasScore) {
          const sc = songRes.score;
          const isFullCombo = sc[4] >= s.notes;
          const comboClass = isFullCombo ? 'stat-val combo stat-highlight' : 'stat-val combo';
          statsHtml = `
            <td><span class="stat-label">良:</span><span class="stat-val">${sc[0]}</span></td>
            <td><span class="stat-label">可:</span><span class="stat-val">${sc[1]}</span></td>
            <td><span class="stat-label">不可:</span><span class="stat-val">${sc[2]}</span></td>
            <td><span class="stat-label">连打:</span><span class="stat-val">${sc[3]}</span></td>
            <td><span class="stat-label">连击:</span><span class="${comboClass}">${sc[4]}/${s.notes}</span></td>
          `;
        } else {
          statsHtml = `<td colspan="5"><span class="song-missing">未游玩</span></td>`;
        }

        const displayName = getSongName(s);
        songsHtml += `<tr><td class="song-name-cell">${s.order}. ${displayName} <span class="song-diff">[${diffLabel}${diffStars}]</span>${idTag}</td>${statsHtml}<td style="text-align:right;white-space:nowrap;border:none;">${editBtn}${manualBadge}</td></tr>`;
      }
      songsHtml += '</tbody></table></div>';

      let condsHtml = '<div class="detail-section"><div class="detail-section-title">合格条件</div><ul class="cond-list">';
      const sortedConds = [...dani.clear_conditions].sort((a, b) => (a.order || 0) - (b.order || 0));

      for (const cond of sortedConds) {
        const typeLabel = TYPE_LABELS[cond.type] || cond.type;
        condsHtml += `<li class="cond-item"><div class="cond-type">${typeLabel}</div>`;

        if (cond.type === 'gauge') {
          condsHtml += `<div class="cond-row">`;
          if (cond.red) {
            condsHtml += `<span class="cond-badge badge-red">赤合格 ${cond.red.operator} ${formatValue('gauge', cond.red.value)}</span>`;
          }
          if (cond.gold) {
            condsHtml += `<span class="cond-badge badge-gold">金合格 ${cond.gold.operator} ${formatValue('gauge', cond.gold.value)}</span>`;
          }
          condsHtml += `</div>`;
        } else if (cond.scope === 'shared') {
          const playerVal = result.values ? result.values[cond.type] : null;
          const playerText = result.hasMissing ? '未游玩' : (playerVal != null ? formatValue(cond.type, playerVal) : '-');
          const badgeClass = result.hasMissing ? 'badge-missing' : 'badge-score';
          condsHtml += `<div class="cond-row">`;
          if (cond.red) {
            condsHtml += `<span class="cond-badge badge-red">赤合格 ${cond.red.operator} ${formatValue(cond.type, cond.red.value)}</span>`;
          }
          if (cond.gold) {
            condsHtml += `<span class="cond-badge badge-gold">金合格 ${cond.gold.operator} ${formatValue(cond.type, cond.gold.value)}</span>`;
          }
          condsHtml += `<span class="cond-badge ${badgeClass}">最佳成绩 ${playerText}</span>`;
          condsHtml += `</div>`;
        } else if (cond.scope === 'per_song') {
          condsHtml += `<div class="per-song-grid">`;
          for (let i = 0; i < 3; i++) {
            const songRes = result.songResults[i];
            const hasScore = songRes && songRes.score != null;
            const playerVal = result.perSongValues && result.perSongValues[cond.type] ? result.perSongValues[cond.type][i] : null;
            const playerText = hasScore ? formatValue(cond.type, playerVal) : '未游玩';
            const badgeClass = hasScore ? 'badge-score' : 'badge-missing';
            const redReq = cond.red && cond.red[i] ? cond.red[i] : null;
            const goldReq = cond.gold && cond.gold[i] ? cond.gold[i] : null;

            condsHtml += `<div class="per-song-item">`;
            condsHtml += `<div class="per-song-title">第 ${i + 1} 曲</div>`;
            condsHtml += `<div style="margin-bottom:4px;">`;
            if (redReq) {
              condsHtml += `<span class="cond-badge badge-red">赤 ${redReq.operator} ${formatValue(cond.type, redReq.value)}</span> `;
            }
            if (goldReq) {
              condsHtml += `<span class="cond-badge badge-gold">金 ${goldReq.operator} ${formatValue(cond.type, goldReq.value)}</span>`;
            }
            condsHtml += `</div>`;
            condsHtml += `<span class="cond-badge ${badgeClass}">最佳成绩 ${playerText}</span>`;
            condsHtml += `</div>`;
          }
          condsHtml += `</div>`;
        }

        condsHtml += '</li>';
      }
      condsHtml += '</ul></div>';

      return `<div class="detail-panel">${header}${songsHtml}${condsHtml}</div>`;
    }

    function startEditSong(songKey, order, btn) {
      const row = btn.closest('tr');
      const oldForm = row.parentNode.querySelector('.edit-form-row');
      if (oldForm) oldForm.remove();

      const currentScore = getScore(...songKey.split('_').map(Number)) || [0, 0, 0, 0, 0];

      const formRow = document.createElement('tr');
      formRow.className = 'edit-form-row';
      formRow.innerHTML = `
        <td colspan="7">
          <div class="edit-form">
            <label>良 <input type="number" min="0" class="edit-input" data-idx="0" value="${currentScore[0] || 0}"></label>
            <label>可 <input type="number" min="0" class="edit-input" data-idx="1" value="${currentScore[1] || 0}"></label>
            <label>不可 <input type="number" min="0" class="edit-input" data-idx="2" value="${currentScore[2] || 0}"></label>
            <label>连打 <input type="number" min="0" class="edit-input" data-idx="3" value="${currentScore[3] || 0}"></label>
            <label>连击 <input type="number" min="0" class="edit-input" data-idx="4" value="${currentScore[4] || 0}"></label>
            <button class="sync-btn" onclick="saveManualScore('${songKey}', this)">保存</button>
            <button class="sync-btn" style="background:#999;" onclick="cancelEditSong(this)">取消</button>
          </div>
        </td>
      `;
      row.after(formRow);
    }

    function saveManualScore(songKey, btn) {
      const formRow = btn.closest('.edit-form-row');
      const inputs = formRow.querySelectorAll('.edit-input');
      const values = [];
      for (const input of inputs) {
        const val = parseInt(input.value, 10);
        if (isNaN(val) || val < 0) {
          alert('请输入非负整数');
          return;
        }
        values.push(val);
      }

      manualScoreMap.set(songKey, values);
      const existingHighScore = highScoreMap.get(songKey);
      manualHighScoreMap.set(songKey, existingHighScore || 0);

      const obj = {};
      for (const [key, val] of manualScoreMap) {
        obj[key] = {
          high_score_result: val,
          high_score: manualHighScoreMap.get(key) || 0
        };
      }
      localStorage.setItem('5y3d_manual_scores', JSON.stringify(obj));

      const savedKey = selectedCellKey;
      selectedCellKey = null;
      renderMatrix();
      if (savedKey) {
        const cell = document.querySelector(`.dani-cell[data-key="${savedKey}"]`);
        if (cell) cell.click();
      }
    }

    function cancelEditSong(btn) {
      const formRow = btn.closest('.edit-form-row');
      if (formRow) formRow.remove();
    }

    function resetManualScores() {
      if (!confirm('确定要清空所有手动修改的成绩吗？')) return;
      manualScoreMap.clear();
      manualHighScoreMap.clear();
      localStorage.removeItem('5y3d_manual_scores');
      const savedKey = selectedCellKey;
      selectedCellKey = null;
      renderMatrix();
      if (savedKey) {
        const cell = document.querySelector(`.dani-cell[data-key="${savedKey}"]`);
        if (cell) cell.click();
      }
    }

    loadData().catch(err => {
      console.error('Data loading failed:', err);
      const loadingEl = document.getElementById('loading');
      loadingEl.innerHTML = `<div style="color:#c62828;margin-bottom:8px;">数据加载失败</div><div style="color:#666;font-size:0.9rem;">${err.message || '未知错误'}</div><div style="color:#666;font-size:0.85rem;margin-top:8px;">提示：请使用静态服务器（如 python -m http.server）打开本页面，不要直接用 file:// 协议访问。</div>`;
    });
  </script>
